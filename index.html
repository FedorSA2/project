<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Электроника — магазин</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span id="logoIcon"></span> <span id="siteTitle"></span>
    </a>
    <nav class="nav">
      <a href="#hero">Главная</a>
      <a href="#about">О нас</a>
      <a href="#advantages">Преимущества</a>
      <a href="#products">Товары</a>
    </nav>
    <a href="admin.html" class="admin-btn">🔒 Админ</a>
  </div>
</header>

<section id="hero" class="hero">
  <div class="container">
    <h1 id="heroTitle"></h1>
    <p id="heroSubtitle"></p>
    <a href="#products" class="btn-primary" id="heroBtn"></a>
  </div>
</section>

<section id="about" class="section">
  <div class="container about-grid">
    <div>
      <h2 id="aboutTitle"></h2>
      <p id="aboutText"></p>
    </div>
    <img id="aboutImage" src="" alt="О нас" />
  </div>
</section>

<section id="advantages" class="section section-alt">
  <div class="container">
    <h2 class="section-title">Наши преимущества</h2>
    <div class="adv-grid" id="advantagesGrid"></div>
  </div>
</section>

<section id="products" class="section">
  <div class="container">
    <h2 class="section-title">Каталог товаров</h2>
    <div class="products-grid" id="productsGrid"></div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-grid">
    <div>
      <h3 id="footerLogo"></h3>
      <p id="footerAddress"></p>
    </div>
    <div>
      <h4>Контакты</h4>
      <p id="footerPhone"></p>
      <p id="footerEmail"></p>
    </div>
    <div>
      <h4>Режим работы</h4>
      <p>Пн–Пт: 10:00–20:00</p>
      <p>Сб–Вс: 11:00–18:00</p>
    </div>
  </div>
  <div class="footer-bottom"><p id="footerCopyright"></p></div>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
